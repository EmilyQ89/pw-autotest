[pytest]
testpaths = tests
pythonpath = .
norecursedirs = venv .venv node_modules
addopts =
    --screenshot only-on-failure
    --tracing retain-on-failure
    --alluredir allure-results
    --clean-alluredir
markers =
    smoke: 冒烟用例，每个核心模块一条主路径
    regression: 冒烟以外的回归用例
    quarantine(owner, issue, until): 不稳定用例，必须写负责人、缺陷单和到期日 YYYY-MM-DD
